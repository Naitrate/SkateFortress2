# tf2-skate: builds the mod's Windows client.dll and server.dll with Visual
# Studio 2022 (Valve's createallprojects.bat route, TF only), on every push and
# on demand. Download the run's "mod_tf-win64" artifact (it holds x64/) into
# game/mod_tf/bin; see tools/package-mod.sh.
# skate3.dll and libvgmstream.dll come from the engine side:
# build-skate-lib-windows.sh and build-vgmstream.sh --windows.
name: Windows build

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: microsoft/setup-msbuild@v2

      - name: Generate the Visual Studio solution
        working-directory: src
        shell: cmd
        run: devtools\bin\vpc.exe /tf /define:SOURCESDK +everything /mksln everything.sln

      - name: Build
        working-directory: src
        shell: pwsh
        run: |
          # VPC names the solution's platforms itself; build its Release one.
          $configs = Select-String -Path everything.sln -Pattern '^\s*(Release\|[^=\s]+)\s*=' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -Unique
          Write-Host "Release configurations: $configs"
          $platform = ($configs | Select-Object -First 1).Split('|')[1]
          msbuild everything.sln /m /p:Configuration=Release "/p:Platform=$platform" /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: mod_tf-win64
          path: |
            game/mod_tf/bin/**/client.dll
            game/mod_tf/bin/**/server.dll
            game/mod_tf/bin/**/client.pdb
            game/mod_tf/bin/**/server.pdb
          if-no-files-found: error
