// tf2-skate controls. Executed from autoexec.cfg.
//
// Skating has its own remappable controls, separate from TF2's binds:
// Options > Advanced > Skate 3 > "Skate 3 controls...", or the skate_controls
// command (cvars cl_skate_key_* / cl_skate_pad_*). The mouse is the right
// stick: pull back then flick forward to ollie, other flicks for flip tricks.
//
// Start/stop skating is a normal bind (Options > Keyboard > Skate 3):

bind "k" "skate_toggle"

// Game controller: Back toggles skating; the sticks drive Skate directly.
// If the right stick seems wrong, run skate_pad_debug while holding it and set
// cl_skate_pad_axes "<LX> <LY> <RX> <RY>".
joystick 1
bind "BACK" "skate_toggle"
// Walking around: left stick moves, right stick looks (once per install;
// skate_controller_layout puts it back any time).
skate_controller_layout_once
// The right stick only pitches the view with joystick look held on. Valve's
// 360controller.cfg turns it on, but Steam Input's pad doesn't get that cfg.
+jlook

echo "tf2-skate: press K (or controller Back) to start or stop skating; skate_controls to remap"
