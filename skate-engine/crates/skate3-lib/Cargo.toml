# libskate3.so for the TF2 mod: skate-game's simulation as a C-callable shared
# library (see crates/skate-game/src/sidecar/ffi.rs). A separate package so
# ordinary skate-game builds don't compile the module tree twice.
[package]
name = "skate3-lib"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "../skate-game/build.rs"

[lib]
name = "skate3"
path = "../skate-game/src/sidecar_lib.rs"
crate-type = ["cdylib"]
test = false
doctest = false

# Same as skate-game's, without bevy's dynamic linking.
[dependencies]
bevy = { workspace = true, features = ["jpeg", "trace", "debug", "bevy_audio", "wav"] }
skate-core.workspace = true
skate-data.workspace = true
half = "=2.7.1"
serde_json.workspace = true
serde.workspace = true
skate-net = { path = "../skate-net" }
blake3 = "=1.8.7"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
skate-mods = { path = "../skate-mods" }
skate-dynamics = { path = "../skate-dynamics" }
gltf = { version = "=1.4.1", default-features = true }
lzma-rs = "0.3"
flate2 = "=1.1.10"
# Platform-independent maths for cross-platform determinism (src/det_math.rs).
libm = "=0.2.16"
