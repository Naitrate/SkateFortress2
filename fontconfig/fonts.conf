<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  tf2-skate: fontconfig setup for the game (play.sh sets FONTCONFIG_FILE).

  The Source engine bundles its own libfontconfig, which doesn't look in
  /etc/fonts, so on its own it runs with no config at all ("Fontconfig error:
  Cannot load default config file"). Load Steam runtime's config instead.

  It also hides user-installed copies of Marlett (e.g. Windows fonts in
  ~/.local/share/fonts), so VGUI's symbols (close button, scrollbar arrows)
  come from the game's own resource/marlett.ttf.
-->
<fontconfig>
	<include ignore_missing="yes">/etc/fonts/fonts.conf</include>
	<selectfont>
		<rejectfont>
			<glob>/home/*/.local/share/fonts/*marlett*</glob>
			<glob>/home/*/.local/share/fonts/*/*marlett*</glob>
			<glob>/home/*/.fonts/*marlett*</glob>
			<glob>/usr/share/fonts/*/*marlett*</glob>
			<glob>/usr/share/fonts/*/*/*marlett*</glob>
		</rejectfont>
	</selectfont>
</fontconfig>
